<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; min-height:100%;
    font-family:'Inter', sans-serif;
    background: #1F2340;
    background-image: radial-gradient(circle at 15% 20%, rgba(255,255,255,0.06), transparent 40%),
                       radial-gradient(circle at 85% 80%, rgba(255,255,255,0.05), transparent 45%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 28px 18px;
  }

  .wrap{ width:100%; max-width: 480px; text-align:center; }

  h1{
    font-family:'Fredoka', sans-serif;
    color:white;
    font-size: clamp(1.6rem, 6vw, 2.2rem);
    margin: 0 0 8px;
  }
  p.sub{
    color: rgba(255,255,255,0.6);
    margin: 0 0 28px;
    font-size: 0.95rem;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap: 14px;
  }

  .link-card{
    display:block;
    background: white;
    border-radius: 16px;
    padding: 18px 22px;
    text-decoration:none;
    color: #1F2340;
    text-align:left;
    box-shadow: 0 10px 24px rgba(0,0,0,0.2);
    transition: transform .12s ease;
  }
  .link-card:active{ transform: scale(0.98); }

  .link-title{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: 1.15rem;
    margin: 0 0 4px;
  }
  .link-desc{
    font-size: 0.88rem;
    color: #6B7099;
    margin:0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Hey 👋</h1>
    <p class="sub">Pick a page to open</p>
    <div class="links">
      <a class="link-card" href="birthday.html">
        <div class="link-title">🎁 Birthday Surprise</div>
        <p class="link-desc">A little gift page — open on her birthday</p>
      </a>
      <a class="link-card" href="memories.html">
        <div class="link-title">📌 The Hyderabad Days</div>
        <p class="link-desc">Team memories, one scene at a time</p>
      </a>
      <a class="link-card" href="questions.html">
        <div class="link-title">🎉 Team Icebreakers</div>
        <p class="link-desc">100 questions for the next hangout</p>
      </a>
    </div>
  </div>
</body>
</html>
